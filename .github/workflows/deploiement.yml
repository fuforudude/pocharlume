name: Déploiement (VPS et GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verifier
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5

  # Le site sur le VPS (pocharlume.fr). La clé ne peut que synchroniser /var/www/pocharlume (rrsync côté serveur,
  # voir infra/vps/site-pocharlume.sh) ; l'empreinte du serveur est vérifiée (ED25519 SHA256:DEhyO4…8Pts).
  vps:
    needs: construire
    runs-on: ubuntu-latest
    concurrency:
      group: vps
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Envoi sur le VPS
        env:
          CLE: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          echo '145.239.83.184 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC4rJXBJwAFz/bE/P73BRpZJgKmPhjkq9LxRjUXB5/S+' > ~/.ssh/known_hosts
          # --delay-updates : les nouveaux fichiers n'apparaissent qu'à la fin, le site n'est jamais à moitié à jour.
          rsync -rlz --delete-after --delay-updates --chmod=D755,F644 \
            -e 'ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            dist/ deploy@145.239.83.184:./
